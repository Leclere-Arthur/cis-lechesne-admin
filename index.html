<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Administration - CIS Le Chesne</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .carte {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,.10);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      text-align: center;
    }

    .sous-titre {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #111827;
      outline-offset: 1px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 22px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      line-height: 1.4;
    }

    .erreur {
      color: #dc2626;
    }

    .succes {
      color: #15803d;
    }

    #admin {
      display: none;
    }

    .admin-titre {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .admin-info {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .badge-admin {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
      padding: 7px 12px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- CONNEXION -->
    <div class="carte" id="connexion">

      <h1>CIS Le Chesne</h1>

      <div class="sous-titre">
        Espace d'administration
      </div>

      <form id="formConnexion">

        <label for="identifiant">
          Identifiant
        </label>

        <input
          id="identifiant"
          type="text"
          autocomplete="username"
          autocapitalize="characters"
          placeholder="Identifiant"
          required
        >

        <label for="motDePasse">
          Mot de passe
        </label>

        <input
          id="motDePasse"
          type="password"
          autocomplete="current-password"
          placeholder="Mot de passe"
          required
        >

        <button
          id="boutonConnexion"
          type="submit"
        >
          Se connecter
        </button>

      </form>

      <div
        id="messageConnexion"
        class="message"
      ></div>

    </div>


    <!-- ESPACE ADMIN -->
    <div class="carte" id="admin">

      <div class="badge-admin">
        SPV ADMIN
      </div>

      <div class="admin-titre">
        Administration
      </div>

      <div
        class="admin-info"
        id="nomAdmin"
      ></div>

      <p>
        Bienvenue dans l'espace d'administration du CIS Le Chesne.
      </p>

      <p>
        La connexion avec l'application principale fonctionne.
      </p>

      <button id="deconnexion">
        Se déconnecter
      </button>

    </div>

  </div>


  <script>

    /* =====================================================
       CONFIGURATION SUPABASE
       ===================================================== */

    const SUPABASE_URL =
      "https://ovkojorpsabodvmsppri.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_QjukJqkUwFaOZC9okws6xw_VzFE8M3H";

    const DOMAINE_EMAIL_INTERNE =
      "inventaire-caserne.local";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       ELEMENTS DE LA PAGE
       ===================================================== */

    const connexion =
      document.getElementById("connexion");

    const admin =
      document.getElementById("admin");

    const messageConnexion =
      document.getElementById("messageConnexion");

    const nomAdmin =
      document.getElementById("nomAdmin");

    const boutonConnexion =
      document.getElementById("boutonConnexion");


    /* =====================================================
       IDENTIFIANT
       Même fonctionnement que l'application principale
       ===================================================== */

    function normaliserIdentifiantConnexion(valeur) {

      return String(valeur || "")
        .trim()
        .toUpperCase()
        .replace(
          /[^A-Z0-9_-]/g,
          ""
        );
    }


    function construireEmailTechnique(identifiant) {

      return (
        normaliserIdentifiantConnexion(
          identifiant
        ).toLowerCase()
        +
        "@"
        +
        DOMAINE_EMAIL_INTERNE
      );
    }


    /* =====================================================
       MOT DE PASSE
       Même fonctionnement que l'application principale
       ===================================================== */

    function preparerMotDePasseSupabase(motDePasse) {

      const valeur =
        String(motDePasse ?? "");

      if (valeur.length >= 6) {
        return valeur;
      }

      return (
        valeur
        +
        "|CIS|"
        +
        valeur.length
      );
    }


    /* =====================================================
       VERIFICATION DU ROLE ADMIN
       ===================================================== */

    async function verifierAdministrateur(user) {

      const {
        data: profil,
        error
      } =
        await supabaseClient
          .from("profils_utilisateurs")
          .select(`
            id,
            nom,
            prenom,
            actif,
            roles (
              nom
            )
          `)
          .eq("id", user.id)
          .single();


      if (error || !profil) {

        console.error(
          "Profil introuvable :",
          error
        );

        return false;
      }


      if (profil.actif !== true) {
        return false;
      }


      const role =
        Array.isArray(profil.roles)
          ? profil.roles[0]
          : profil.roles;


      if (
        !role ||
        String(role.nom || "")
          .trim()
          .toUpperCase()
          !==
          "SPV ADMIN"
      ) {
        return false;
      }


      const nomComplet =
        [
          profil.prenom || "",
          profil.nom || ""
        ]
        .join(" ")
        .trim();


      nomAdmin.textContent =
        nomComplet ||
        "Administrateur";


      return true;
    }


    /* =====================================================
       OUVERTURE DE L'ESPACE ADMIN
       ===================================================== */

    async function ouvrirSession(user) {

      const autorise =
        await verifierAdministrateur(user);


      if (!autorise) {

        await supabaseClient.auth.signOut();

        admin.style.display =
          "none";

        connexion.style.display =
          "block";

        messageConnexion.textContent =
          "Accès refusé : cet espace est réservé aux SPV Admin.";

        messageConnexion.className =
          "message erreur";

        return;
      }


      messageConnexion.textContent =
        "";

      connexion.style.display =
        "none";

      admin.style.display =
        "block";
    }


    /* =====================================================
       CONNEXION
       ===================================================== */

    document
      .getElementById("formConnexion")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const identifiant =
            normaliserIdentifiantConnexion(
              document
                .getElementById("identifiant")
                .value
            );


          const motDePasse =
            String(
              document
                .getElementById("motDePasse")
                .value || ""
            );


          if (
            !identifiant ||
            !motDePasse
          ) {

            messageConnexion.textContent =
              "Identifiant et mot de passe obligatoires.";

            messageConnexion.className =
              "message erreur";

            return;
          }


          messageConnexion.textContent =
            "Connexion...";

          messageConnexion.className =
            "message";


          boutonConnexion.disabled =
            true;

          boutonConnexion.textContent =
            "Connexion...";


          try {

            /*
             * Première tentative :
             * mot de passe tel qu'il a été saisi.
             */

            let {
              data,
              error
            } =
              await supabaseClient.auth
                .signInWithPassword({

                  email:
                    construireEmailTechnique(
                      identifiant
                    ),

                  password:
                    motDePasse
                });


            /*
             * Comme dans l'application principale :
             * si le code fait moins de 6 caractères,
             * seconde tentative avec le format technique.
             */

            if (
              error &&
              motDePasse.length < 6
            ) {

              const secondeTentative =
                await supabaseClient.auth
                  .signInWithPassword({

                    email:
                      construireEmailTechnique(
                        identifiant
                      ),

                    password:
                      preparerMotDePasseSupabase(
                        motDePasse
                      )
                  });


              data =
                secondeTentative.data;

              error =
                secondeTentative.error;
            }


            if (
              error ||
              !data ||
              !data.user
            ) {

              throw (
                error ||
                new Error(
                  "Connexion impossible."
                )
              );
            }


            await ouvrirSession(
              data.user
            );

          }
          catch (erreur) {

            console.error(
              "Connexion impossible :",
              erreur
            );


            const texte =
              String(
                erreur?.message || ""
              );


            if (
              /invalid login credentials/i
                .test(texte)
            ) {

              messageConnexion.textContent =
                "Identifiant ou mot de passe incorrect.";

            }
            else {

              messageConnexion.textContent =
                "Connexion impossible. Réessayez.";
            }


            messageConnexion.className =
              "message erreur";
          }
          finally {

            boutonConnexion.disabled =
              false;

            boutonConnexion.textContent =
              "Se connecter";
          }

        }
      );


    /* =====================================================
       DECONNEXION
       ===================================================== */

    document
      .getElementById("deconnexion")
      .addEventListener(
        "click",
        async function() {

          await supabaseClient.auth
            .signOut();


          admin.style.display =
            "none";

          connexion.style.display =
            "block";


          document
            .getElementById("motDePasse")
            .value =
            "";


          messageConnexion.textContent =
            "";
        }
      );


    /* =====================================================
       SESSION DEJA OUVERTE
       ===================================================== */

    async function verifierSessionExistante() {

      const { data } =
        await supabaseClient.auth
          .getSession();


      if (
        data.session &&
        data.session.user
      ) {

        await ouvrirSession(
          data.session.user
        );
      }
    }


    verifierSessionExistante();

  </script>

</body>
</html>
